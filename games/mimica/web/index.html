<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mímica | Noite de Jogos</title><link rel="stylesheet" href="/jogos/mimica/style.css"></head>
<body><main class="app"><header><small>NOITE DE JOGOS</small><h1>Mímica</h1><p id="status">Conectando...</p></header>
<section id="entrada" class="card hidden"><h2>Recuperar sessão</h2><p>Informe seu código de 4 dígitos.</p><input id="codigo" inputmode="numeric" maxlength="4" placeholder="0000"><button onclick="recuperar()">Reconectar</button></section>
<section id="sala" class="card hidden"><div class="topline"><h2>Sala</h2><span>Código: <strong id="meuCodigo">----</strong></span></div><div id="jogadoresSala" class="lista"></div><div id="configuracao" class="hidden"><label>Tempo por mímica<input id="tempo" type="number" min="30" max="180" value="60"></label><label>Rodadas<input id="rodadas" type="number" min="1" max="10" value="3"></label><button onclick="comecar()">Começar partida</button></div><p id="aguarde">Aguardando o HOST iniciar...</p></section>
<section id="partida" class="card hidden"><div class="info"><span>Rodada <strong id="rodada">1/3</strong></span><span id="cronometro">01:00</span></div><div class="vez"><small>VEZ DE</small><strong id="jogadorAtual">—</strong></div><div id="tema" class="tema hidden"></div><button id="revelar" class="hidden" onclick="revelar()">Revelar minha mímica</button><p id="orientacao"></p><div id="pausa" class="alerta hidden"><strong>Turno pausado</strong><p>O jogador da vez desconectou.</p><button id="pular" class="hidden" onclick="pular()">Pular jogador</button></div><div id="controles" class="hidden"><button class="acertou" onclick="resultado(true)">Acertou</button><button class="errou" onclick="resultado(false)">Não acertou</button></div><h3>Placar</h3><div id="placar" class="lista"></div></section>
<section id="final" class="card hidden"><h2>Placar final</h2><div id="placarFinal" class="lista"></div><button id="nova" class="hidden" onclick="novaPartida()">Nova partida</button></section><button id="voltar" class="secondary hidden" onclick="voltarLobby()">Voltar ao Lobby</button></main><script src="/jogos/mimica/game.js"></script></body></html>
