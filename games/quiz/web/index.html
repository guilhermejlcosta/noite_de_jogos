<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz | Noite de Jogos</title><link rel="stylesheet" href="/jogos/quiz/style.css"></head>
<body><main class="app"><header><small>NOITE DE JOGOS</small><h1>Quiz</h1><p id="status">Conectando...</p></header>
<section id="entrada" class="card hidden"><h2>Recuperar sessão</h2><p>Informe seu código de 4 dígitos.</p><input id="codigo" inputmode="numeric" maxlength="4" placeholder="0000"><button onclick="recuperar()">Reconectar</button></section>
<section id="sala" class="card hidden"><div class="topline"><h2>Sala</h2><span>Código: <strong id="meuCodigo">----</strong></span></div><p>Banco com 560 perguntas de dificuldade média, divididas igualmente em 8 categorias.</p><div id="jogadoresSala" class="lista"></div><div id="configuracao" class="hidden"><label>Quantidade de perguntas<input id="quantidade" type="number" min="5" max="50" value="10"></label><label>Tempo por pergunta<input id="tempo" type="number" min="10" max="60" value="20"></label><button onclick="comecar()">Começar Quiz</button></div><p id="aguarde">Aguardando o HOST iniciar...</p></section>
<section id="partida" class="card hidden"><div class="topline"><span>Pergunta <strong id="progresso">1/10</strong></span><strong id="cronometro">00:20</strong></div><h2 id="pergunta" class="pergunta"></h2><div id="alternativas" class="alternativas"></div><p id="mensagem"></p><div id="respostasJogadores" class="chips"></div><button id="encerrar" class="secondary hidden" onclick="encerrar()">Encerrar respostas agora</button><button id="proxima" class="hidden" onclick="proxima()">Próxima pergunta</button></section>
<section id="final" class="card hidden"><h2>Resultado final</h2><div id="destaqueFinal" class="destaque-final"></div><div id="placarFinal" class="lista"></div><button id="nova" class="hidden" onclick="novaPartida()">Novo Quiz</button></section><button id="voltar" class="secondary hidden" onclick="voltarLobby()">Voltar ao Lobby</button></main><script src="/jogos/quiz/game.js"></script></body></html>
