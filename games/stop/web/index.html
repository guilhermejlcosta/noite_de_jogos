<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stop | Noite de Jogos</title><link rel="stylesheet" href="/jogos/stop/style.css"></head><body><main class="app"><header><small>NOITE DE JOGOS</small><h1>STOP!</h1><p id="status">Conectando...</p></header>
<section id="entrada" class="card hidden"><h2>Recuperar sessão</h2><input id="codigo" inputmode="numeric" maxlength="4" placeholder="0000"><button onclick="recuperar()">Reconectar</button></section>
<section id="sala" class="card hidden"><div class="topline"><h2>Sala</h2><span>Código: <strong id="meuCodigo">----</strong></span></div><div id="jogadoresSala" class="lista"></div><div id="config" class="hidden"><label>Rodadas<input id="rodadas" type="number" min="1" max="10" value="3"></label><label>Tempo por rodada<input id="tempo" type="number" min="30" max="180" value="90"></label><button onclick="comecar()">Começar</button></div><p id="aguarde">Aguardando o HOST...</p></section>
<section id="jogo" class="card hidden"><div class="topline"><span>Rodada <strong id="progresso">1/3</strong></span><strong id="cronometro">01:30</strong></div><div class="letra"><small>LETRA</small><strong id="letra">A</strong></div><div id="formulario"></div><button id="salvar" class="secondary" onclick="salvar(false)">Salvar respostas</button><button id="stop" class="stop" onclick="salvar(true)">STOP!</button><p id="mensagem"></p><button id="encerrar" class="secondary hidden" onclick="encerrar()">Encerrar rodada</button></section>
<section id="revisao" class="card hidden"><h2>Revisão da rodada</h2><p>Respostas iguais valem 5 pontos; únicas valem 10. O HOST pode tocar em uma resposta para invalidá-la.</p><div id="tabelas"></div><button id="proxima" class="hidden" onclick="proxima()">Próxima rodada</button></section>
<section id="final" class="card hidden"><h2>Resultado final</h2><div id="destaque" class="destaque"></div><div id="ranking" class="lista"></div><button id="nova" class="hidden" onclick="novaPartida()">Nova partida</button></section><button id="voltar" class="secondary hidden" onclick="voltarLobby()">Voltar ao Lobby</button></main><script src="/jogos/stop/game.js"></script></body></html>
