<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mais provável de...</title><link rel="stylesheet" href="/jogos/mais-provavel/style.css"></head>
<body><main class="app"><header><small>NOITE DE JOGOS</small><h1>Mais provável de...</h1><p id="status">Conectando...</p></header>
<section id="entrada" class="card hidden"><h2>Recuperar sessão</h2><p>Informe seu código de 4 dígitos.</p><input id="codigo" inputmode="numeric" maxlength="4" placeholder="0000"><button onclick="recuperar()">Reconectar</button></section>
<section id="sala" class="card hidden"><div class="topline"><h2>Sala</h2><span>Código: <strong id="meuCodigo">----</strong></span></div><p>Leia a situação e vote secretamente em quem mais combina com ela.</p><div id="jogadoresSala" class="lista"></div><div id="configuracao" class="hidden"><label>Quantidade de situações<input id="quantidade" type="number" min="5" max="30" value="10"></label><button onclick="comecar()">Começar votação</button></div><p id="aguarde">Aguardando o HOST iniciar...</p></section>
<section id="partida" class="card hidden"><div class="topline"><span>Rodada <strong id="progresso">1/10</strong></span><span id="fase">Votando</span></div><h2 id="situacao" class="situacao"></h2><div id="opcoes" class="opcoes"></div><p id="mensagem"></p><div id="statusVotos" class="chips"></div><div id="resultadoRodada" class="hidden"><h3>Resultado da rodada</h3><div id="contagem" class="lista"></div></div><button id="encerrar" class="secondary hidden" onclick="encerrar()">Encerrar votação</button><button id="proxima" class="hidden" onclick="proxima()">Próxima situação</button></section>
<section id="final" class="card hidden"><h2>Resultado final</h2><div id="destaque" class="destaque"></div><div id="ranking" class="lista"></div><button id="nova" class="hidden" onclick="novaPartida()">Nova partida</button></section><button id="voltar" class="secondary hidden" onclick="voltarLobby()">Voltar ao Lobby</button></main><script src="/jogos/mais-provavel/game.js"></script></body></html>
