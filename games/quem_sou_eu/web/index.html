<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quem Sou Eu?</title><link rel="stylesheet" href="/jogos/quem-sou-eu/style.css"></head>
<body><main class="app"><header><small>NOITE DE JOGOS</small><h1>Quem Sou Eu?</h1><p id="status">Conectando...</p></header>
<section id="entrada" class="card hidden"><h2>Recuperar sessão</h2><p>Informe seu código de 4 dígitos.</p><input id="codigo" inputmode="numeric" maxlength="4" placeholder="0000"><button onclick="recuperar()">Reconectar</button></section>
<section id="sala" class="card hidden"><div class="topline"><h2>Sala</h2><span>Código: <strong id="meuCodigo">----</strong></span></div><p>Todos veem a sua identidade, menos você. Faça perguntas respondidas com sim ou não.</p><div id="jogadores" class="jogadores"></div><button id="comecar" class="hidden" onclick="comecar()">Distribuir identidades</button><p id="aguarde">Aguardando o HOST iniciar...</p></section>
<section id="partida" class="card hidden"><div class="vez"><span>VEZ DE</span><strong id="jogadorAtual">—</strong></div><div id="identidades" class="jogadores"></div><div id="controles" class="hidden"><p>Qual foi a resposta?</p><button class="yes" onclick="responder('sim')">Sim — continua</button><button class="no" onclick="responder('nao')">Não — próximo</button><button class="hit" onclick="responder('acertou')">Acertou quem é!</button></div><p id="orientacao"></p></section>
<section id="final" class="card hidden"><h2>Fim de jogo!</h2><ol id="resultado"></ol><button id="novaPartida" class="hidden" onclick="novaPartida()">Nova partida</button></section><button id="voltar" class="secondary hidden" onclick="voltarLobby()">Voltar ao Lobby</button></main><script src="/jogos/quem-sou-eu/game.js"></script></body></html>
